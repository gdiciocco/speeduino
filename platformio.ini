;STM32 Official core
[env:BlackPill_F411CE_USB]
platform = ststm32@16.0.0
framework = arduino
board = blackpill_f411ce
lib_deps = 
	stm32duino/STM32duino RTC @ 1.2.0
	${common.lib_deps}
board_build.core = stm32
build_flags = -O3 -std=c++14 -UBOARD_MAX_IO_PINS -DUSBCON -DHAL_PCD_MODULE_ENABLED -DUSBD_USE_CDC -DUSBD_IRQ_PRIO=10 -DUART_IRQ_PRIO=11
upload_protocol = dfu
debug_tool = stlink
monitor_speed = 115200

[platformio]
src_dir=speeduino
default_envs = caponord_black_f407zg
; local.ini is ignored via .gitignore
; This allows developers to make private/local PIO configuration changes without 
; triggering Git changes in their dev tooling (E.g. VS Code)  
extra_configs = local.ini

[env]
test_build_src = yes

[env:native_base]
platform = native
build_unflags = -fno-exceptions
build_flags = 
    -DNATIVE_BOARD 
    -DEXTERNAL_BOARD_H=\"board_native.h\" 
    -DARDUINO=101
	-D USBCON
    -std=c++14 
	-fshort-enums
	-fexceptions
lib_deps = 
	${common.lib_deps}
	https://github.com/adbancroft/ArduinoNativeFake
lib_compat_mode = off

[env:native_code_coverage]
extends = env:native_base
build_unflags = -Os -flto -Werror
build_flags = 
	${env:native_base.build_flags}
	; Needed for setUp()
    -DUNITY_INCLUDE_SETUP_STUBS
	; Turn off optimizations & inlining to improve quality of coverage reporting
	-O0	-fno-inline -fno-inline-small-functions -fno-default-inline
	; Coverage flags
    -lgcov -fprofile-arcs -ftest-coverage
