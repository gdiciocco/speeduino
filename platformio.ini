; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; http://docs.platformio.org/page/projectconf.html

[common]
; These libraries are used by all builds.
lib_deps = 
	frankboesing/FastCRC@^1.41

[env:teensy35]
;platform=teensy
platform=https://github.com/platformio/platform-teensy.git
board=teensy35
framework=arduino
lib_deps = 
	EEPROM
	FlexCAN_T4
	Time
	InternalTemperature
	${common.lib_deps}
extra_scripts = post:post_extra_script.py  

[env:teensy36]
;platform=teensy
platform=https://github.com/platformio/platform-teensy.git
board=teensy36
framework=arduino
lib_deps = 
	EEPROM
	FlexCAN_T4
	Time
	InternalTemperature
	${common.lib_deps}
extra_scripts = post:post_extra_script.py  

[env:teensy41]
;platform=teensy
platform=https://github.com/platformio/platform-teensy.git
board=teensy41
framework=arduino
lib_deps = 
	EEPROM
	FlexCAN_T4
	Time
	InternalTemperature
	${common.lib_deps}
build_flags = -DTEENSY_INIT_USB_DELAY_AFTER=40
extra_scripts = post:post_extra_script.py  

;STM32 Official core
[env:black_F407VE]
platform = ststm32@16.0.0
framework = arduino
board = black_f407ve
; RTC library fixed to 1.2.0, because in newer than that the RTC fails to keep up time. At least up to 1.3.7 version
lib_deps = 
	stm32duino/STM32duino RTC @ 1.2.0
	greiman/SdFat
	elapsedMillis
	${common.lib_deps}
board_build.core = stm32
; USBD_IRQ_PRIO/UART_IRQ_PRIO: keep comms IRQs below the trigger EXTI (6) and the timers (7-9). Core defaults are 1, which lets USB/UART preempt the trigger
build_flags = -std=c++14 -UBOARD_MAX_IO_PINS -DENABLE_HWSERIAL2 -DENABLE_HWSERIAL3 -DUSBCON -DHAL_PCD_MODULE_ENABLED -DUSBD_USE_CDC -DHAL_CAN_MODULE_ENABLED -DSERIAL_TX_BUFFER_SIZE=128 -DSERIAL_RX_BUFFER_SIZE=128 -DUSBD_IRQ_PRIO=10 -DUART_IRQ_PRIO=11
upload_protocol = dfu
debug_tool = stlink
monitor_speed = 115200

[env:caponord_black_f407zg]
extends = env:black_F407VE
board = black_f407zg
build_flags =
	${env:black_F407VE.build_flags}
	-DCAPONORD_BOARD
	-DOIL_SENSOR_OPST
	-DSRAM_AS_EEPROM
	-O3

; For testing only
[env:black_F407VE_tests]
extends = env:black_F407VE
upload_protocol = stlink
build_flags = 
    ${env:black_F407VE.build_flags}
	-D PIO_FRAMEWORK_ARDUINO_ENABLE_CDC
	-D USBD_VID=0x0483
	-D USBD_PID=0x0003
	-D USB_MANUFACTURER="Speeduino"
	-D USB_PRODUCT="\"black_f407ve\""
extra_scripts = post:post_extra_script.py  

; Unit tests on real hardware.
;
; The bench board is a Black F407ZG on USB CDC with no debug probe, so uploads
; go through the STM32 system bootloader: tools/dfu_upload.py asks the running
; firmware to jump there (TS command button 12801), then dfu-util writes the
; image and leaves. Set SPEEDUINO_HW_PORT if the board is not on COM25.
;
;   pio test -e caponord_hw_test
[env:caponord_hw_test]
extends = env:caponord_black_f407zg
build_flags =
	${env:caponord_black_f407zg.build_flags}
	-D PIO_FRAMEWORK_ARDUINO_ENABLE_CDC
upload_protocol = custom
upload_command = "$PYTHONEXE" "$PROJECT_DIR/tools/dfu_upload.py" $SOURCE
test_port = COM25
test_speed = 115200

; For testing only
[env:black_F407VE-EEPROM-SRAM]
extends = env:black_F407VE
build_flags = ${env:black_F407VE.build_flags} -DSRAM_AS_EEPROM
; For testing only
[env:black_F407VE-EEPROM-SPI]
extends = env:black_F407VE
build_flags = ${env:black_F407VE.build_flags} -DUSE_SPI_EEPROM
; For testing only
[env:black_F407VE-EEPROM-FRAM]
extends = env:black_F407VE
build_flags = ${env:black_F407VE.build_flags} -DFRAM_AS_EEPROM

;STM32 Official core - FCR Micro F4 (STM32F429VIT6, 2MB flash, 8MHz HSE)
; W25Q16 SPI flash on SPI3 (CS=PA15) as EEPROM, CAN1 on ALT_2 (PD0/PD1), USB CDC with VBUS sense on PA9.
[env:FCR_Micro_F4]
platform = ststm32@16.0.0
framework = arduino
; Project-local board def (boards/fcr_micro_f4.json) wrapping the stm32duino F429VITx variant
board = fcr_micro_f4
lib_deps =
	stm32duino/STM32duino RTC @ 1.2.0
	elapsedMillis
	${common.lib_deps}
board_build.core = stm32
; The stm32duino generic F429VITx variant ships without an ldscript.ld, so provide one in-repo.
board_build.ldscript = boards/ldscript_fcr_micro_f4.ld
build_flags = -Wl,--wrap=pinMode
    -DBOARD_FCR_MICRO_F4 -std=c++14 -UBOARD_MAX_IO_PINS -DENABLE_HWSERIAL2 -DENABLE_HWSERIAL3 -DUSBCON -DHAL_PCD_MODULE_ENABLED -DUSBD_USE_CDC -DHAL_CAN_MODULE_ENABLED -DSERIAL_TX_BUFFER_SIZE=128 -DSERIAL_RX_BUFFER_SIZE=128 -DUSE_SPI_EEPROM=PA15 -DHSE_VALUE=8000000 -DINJ_CHANNELS=2 -DIGN_CHANNELS=2 -DUSBD_IRQ_PRIO=10 -DUART_IRQ_PRIO=11
upload_protocol = dfu
debug_tool = stlink
monitor_speed = 115200

;STM32 Official core
[env:BlackPill_F401CC]
platform = ststm32@16.0.0
framework = arduino
board = blackpill_f401cc
lib_deps = 
	stm32duino/STM32duino RTC @ 1.2.0
	${common.lib_deps}
board_build.core = stm32
build_flags = -std=c++14 -UBOARD_MAX_IO_PINS -DUSBCON -DHAL_PCD_MODULE_ENABLED -DUSBD_USE_CDC -DHAL_DAC_MODULE_DISABLED -DHAL_ETH_MODULE_DISABLED -DHAL_SD_MODULE_DISABLED -DHAL_QSPI_MODULE_DISABLED -DUSBD_IRQ_PRIO=10 -DUART_IRQ_PRIO=11
upload_protocol = dfu
debug_tool = stlink
monitor_speed = 115200

;STM32 Official core
[env:BlackPill_F411CE_UART]
platform = ststm32@16.0.0
framework = arduino
board = blackpill_f411ce
lib_deps = 
	stm32duino/STM32duino RTC @ 1.2.0
	${common.lib_deps}
board_build.core = stm32
build_flags = -O3 -std=c++14 -UBOARD_MAX_IO_PINS -DUSBD_IRQ_PRIO=10 -DUART_IRQ_PRIO=11
upload_protocol = dfu
