name: Validate INI

on: pull_request

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate INI
        uses: hyper-tuner/ini-validate-action@v1
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"
          filename: reference/speeduino.ini

      # The action above checks the ini against the TunerStudio schema. This
      # checks it against the firmware: page sizes, the live data block, and
      # that nothing names a channel the ini never declares. The half that
      # needs a board is not run here.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Check INI layout against the firmware
        run: python tools/check_ini_layout.py
